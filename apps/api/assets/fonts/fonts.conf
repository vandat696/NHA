<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Cấu hình fontconfig cho sharp/librsvg khi vẽ chữ trong SVG (mở đầu/kết video).
  Được trỏ tới qua FONTCONFIG_PATH (đặt trong src/video/engine/videogen.ts).
  Ưu tiên font đóng gói trong thư mục này (Noto Sans JP / Noto Sans — OFL, xem
  LICENSE-OFL.txt) để Windows và Linux (Render) vẽ ra cùng một kết quả; font hệ
  thống chỉ là dự phòng.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>C:/Windows/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans JP</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
